<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
	<link rel="canonical" href="https://liceo14.github.io/aviso_fun.html" />
	
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liceo 14 "Treinta y Tres Orientales" - Avisos funcionarios</title>
    <link rel="stylesheet" href="style.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <header class="main-header">
        <div class="overlay">
            <h1>Liceo 14</h1>
            <h2>"Treinta y Tres Orientales"</h2>
        </div>
    </header>

    <nav class="navbar"
		id="main-navbar">
    </nav>

	<div class="container">
		<section class="post">
			<h3>Aviso de inasistencias funcionarios.</h3>
			<br>
		<form id="inasistenciaForm" class="contact-form">
			
			<div class="form-group">
				<label for="full-name">Nombre Completo:</label>
				<input type="text" id="full-name" placeholder="Ej. Juan Pérez" required>
			</div>

			<div class="form-group">
				<label for="cedula">Documento de identidad (8 dígitos):</label>
				<input type="text" id="cedula" placeholder="Ej. 12345678" pattern="\d{8}" title="Ingrese los 8 dígitos sin puntos ni guiones" required>
			</div>
			
			<div class="form-group">
				<label for="fecha">Fecha de la inasistencia:</label>
				<input type="date" id="fecha" required style="width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #ccc;">
			</div>

			<div class="form-group">
				<label for="turno">Turno:</label>
				<select id="turno" required style="width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #ccc;">
					<option value="" disabled selected>Seleccione turno...</option>
					<option value="Matutino">Matutino</option>
					<option value="Vespertino">Vespertino</option>
					<option value="Nocturno">Nocturno</option>
				</select>
			</div>

			<div class="form-group">
				<label for="motivo">Motivo de inasistencia (No Docente):</label>
				<select id="motivo" required style="width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #ccc;">
					<option value="" disabled selected>Seleccione el motivo...</option>
					<option value="Art. 75 - Motivos Personales">Motivos Personales (Art. 75)</option>
					<option value="Art. 33 - Médica / Enfermedad">Médica / Enfermedad (Art. 33)</option>
					<option value="Art. 49 - Maternidad">Maternidad (Art. 49)</option>
					<option value="Art. 57 - Matrimonio">Matrimonio (Art. 57)</option>
					<option value="Art. 58 - Duelo">Duelo (Art. 58)</option>
					<option value="Art. 59 - Examen / Estudio">Examen / Estudio (Art. 59)</option>
					<option value="Art. 62 - Concursos oficiales">Concursos oficiales (Art. 62)</option>
					<option value="Art. 64 - Trámite jubilatorio">Trámite jubilatorio (Art. 64)</option>
					<option value="Art. 65 - Donación de sangre">Donación de sangre (Art. 65)</option>
					<option value="Art. 66 - Familiar enfermo">Familiar enfermo (Art. 66)</option>
					<option value="Art. 76 - Salida dentro del horario">Salida dentro del horario (Art. 76)</option>
					<option value="Art. 77 - Llegada 1 hora tarde">Lleg. 1h. tarde (Art. 77)</option>
					<option value="Otros Motivos">Otros Motivos</option>
				</select>
			</div>

			<div class="form-group">
				<label for="message">Comentarios:</label>
				<textarea id="message" rows="3" placeholder="Ej: POB, POP, Servicio..." ></textarea>
			</div>

			<button type="submit" class="btn-comment">Generar Correo de Aviso</button>
		</form>
		</section>
	</div>
	
	<footer class="main-footer"
		id="main-footer">
	</footer>
	
	<script>
		document.getElementById('inasistenciaForm').addEventListener('submit', function(e) {
		e.preventDefault();

		// 1. Captura de valores
		const nombre = document.getElementById('full-name').value;
		const cedula = document.getElementById('cedula').value;
		const fecha = document.getElementById('fecha').value;
		const turno = document.getElementById('turno').value;
		const motivo = document.getElementById('motivo').value;
		const detalles = document.getElementById('message').value;

		// 2. Preparación del correo
		const destinatario = "inasistenciasfuncionarios14@gmail.com";
		const asunto = `Aviso Inasistencia: ${nombre} - ${fecha} - ${motivo}`;
		
		// Cuerpo del mensaje formateado
		const cuerpo = `AVISO DE INASISTENCIA FUNCIONARIO
	---------------------------------
	FUNCIONARIO: ${nombre}
	CÉDULA: ${cedula}
	FECHA: ${fecha}
	TURNO: ${turno}
	MOTIVO: ${motivo}

	COMENTARIOS:
	${detalles}
	---------------------------------
	Enviado desde el portal web del Liceo 14.`;

		const mailtoUrl = `mailto:${destinatario}?subject=${encodeURIComponent(asunto)}&body=${encodeURIComponent(cuerpo)}`;
		
		// 3. "Abrir en nueva pestaña" y aviso de envío
		const nuevaVentana = window.open(mailtoUrl, '_blank');
		if (nuevaVentana) {
			// Intentamos cerrar la pestaña nueva después de medio segundo
			// Nota: Muchos navegadores bloquean el .close() por seguridad si no hay contenido real
			setTimeout(() => nuevaVentana.close(), 500);
		}
		
		// 4. Mensaje de éxito en TU página
		alert("✅ Su aviso de inasistencia ha sido generado.\n\nPor favor, verifique que su aplicación de correo se haya abierto para completar el envío.");

		// 5. Limpiar el formulario
		document.getElementById('inasistenciaForm').reset();	
	});
	</script>
	
	<script src="main.js"></script>
	
</body>
</html>
