	<script>
		function verificarPin(url) {
			const PIN_CORRECTO = "1963"; // Cambia aquí el pin de 4 dígitos
			let intento = prompt("Ingrese el PIN para continuar:");

			if (intento === PIN_CORRECTO) {
				window.open(url, '_blank');
			} else if (intento === null) {
				// El usuario canceló el prompt, no hacemos nada
			} else {
				alert("PIN incorrecto. Acceso denegado.");
			}
		}

		function verificarPin2(url) {
